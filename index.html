<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Beat Maker — Felipe Buscaglia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="wrap">
        <header>
            <div class="brand">
                <div class="logo" aria-hidden="true">
                    <i class="ph-fill ph-grid-four"></i>
                </div>
                <div class="title-block">
                    <h1>Browser Beat Maker</h1>
                    <div class="sub">step sequencer · v0.1</div>
                </div>
            </div>
            <div class="byline">crafted by <span>felipe buscaglia</span></div>
        </header>

        <section class="console" aria-label="Beat maker console">

            <!-- Transport / controls -->
            <div class="transport">
                <div class="play-cluster">
                    <button class="btn-play" aria-label="Play">
                        <i class="ph-fill ph-play"></i>
                    </button>
                    <div class="tempo-readout">
                        <div class="label">Transport</div>
                        <div class="value">— : — : —</div>
                    </div>
                </div>

                <div class="bpm">
                    <div class="bpm-label">BPM</div>
                    <div class="bpm-slider-wrap">
                        <div class="bpm-track"></div>
                        <input class="bpm-slider" type="range" min="60" max="200" value="120" aria-label="Tempo in beats per minute">
                    </div>
                    <div class="bpm-display">
                        <span class="num">120</span>
                        <span class="unit">bpm</span>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn danger" aria-label="Clear pattern">
                        <i class="ph ph-trash"></i>
                        Clear
                    </button>
                    <button class="btn accent" aria-label="Randomize pattern">
                        <i class="ph ph-dice-five"></i>
                        Randomize
                    </button>
                    <button class="btn" aria-label="Save pattern">
                        <i class="ph ph-floppy-disk"></i>
                        Save
                    </button>
                    <button class="btn" aria-label="Load pattern">
                        <i class="ph ph-folder-open"></i>
                        Load
                    </button>
                </div>
            </div>

            <!-- Step numbers strip -->
            <div class="step-numbers">
                <div class="corner">Steps</div>
                <div class="step-num beat">1</div>
                <div class="step-num">·</div>
                <div class="step-num">·</div>
                <div class="step-num">·</div>
                <div class="step-num beat">5</div>
                <div class="step-num">·</div>
                <div class="step-num">·</div>
                <div class="step-num">·</div>
                <div class="step-num beat">9</div>
                <div class="step-num">·</div>
                <div class="step-num">·</div>
                <div class="step-num">·</div>
                <div class="step-num beat">13</div>
                <div class="step-num">·</div>
                <div class="step-num">·</div>
                <div class="step-num">·</div>
            </div>

            <!-- Grid -->
            <div class="grid">

                <!-- Kick -->
                <div class="row kick">
                    <div class="track-label">
                        <span class="track-dot"></span>
                        <span class="track-name">Kick</span>
                    </div>
                    <label class="cell beat-start"><input type="checkbox" checked aria-label="Kick step 1"></label>
                    <label class="cell"><input type="checkbox" aria-label="Kick step 2"></label>
                    <label class="cell"><input type="checkbox" aria-label="Kick step 3"></label>
                    <label class="cell"><input type="checkbox" aria-label="Kick step 4"></label>
                    <label class="cell beat-start"><input type="checkbox" checked aria-label="Kick step 5"></label>
                    <label class="cell"><input type="checkbox" aria-label="Kick step 6"></label>
                    <label class="cell"><input type="checkbox" aria-label="Kick step 7"></label>
                    <label class="cell"><input type="checkbox" aria-label="Kick step 8"></label>
                    <label class="cell beat-start"><input type="checkbox" checked aria-label="Kick step 9"></label>
                    <label class="cell"><input type="checkbox" aria-label="Kick step 10"></label>
                    <label class="cell"><input type="checkbox" aria-label="Kick step 11"></label>
                    <label class="cell"><input type="checkbox" aria-label="Kick step 12"></label>
                    <label class="cell beat-start"><input type="checkbox" checked aria-label="Kick step 13"></label>
                    <label class="cell"><input type="checkbox" aria-label="Kick step 14"></label>
                    <label class="cell"><input type="checkbox" aria-label="Kick step 15"></label>
                    <label class="cell"><input type="checkbox" aria-label="Kick step 16"></label>
                </div>

                <!-- Snare -->
                <div class="row snare">
                    <div class="track-label">
                        <span class="track-dot"></span>
                        <span class="track-name">Snare</span>
                    </div>
                    <label class="cell beat-start"><input type="checkbox" aria-label="Snare step 1"></label>
                    <label class="cell"><input type="checkbox" aria-label="Snare step 2"></label>
                    <label class="cell"><input type="checkbox" aria-label="Snare step 3"></label>
                    <label class="cell"><input type="checkbox" aria-label="Snare step 4"></label>
                    <label class="cell beat-start"><input type="checkbox" checked aria-label="Snare step 5"></label>
                    <label class="cell"><input type="checkbox" aria-label="Snare step 6"></label>
                    <label class="cell"><input type="checkbox" aria-label="Snare step 7"></label>
                    <label class="cell"><input type="checkbox" aria-label="Snare step 8"></label>
                    <label class="cell beat-start"><input type="checkbox" aria-label="Snare step 9"></label>
                    <label class="cell"><input type="checkbox" aria-label="Snare step 10"></label>
                    <label class="cell"><input type="checkbox" aria-label="Snare step 11"></label>
                    <label class="cell"><input type="checkbox" aria-label="Snare step 12"></label>
                    <label class="cell beat-start"><input type="checkbox" checked aria-label="Snare step 13"></label>
                    <label class="cell"><input type="checkbox" aria-label="Snare step 14"></label>
                    <label class="cell"><input type="checkbox" aria-label="Snare step 15"></label>
                    <label class="cell"><input type="checkbox" aria-label="Snare step 16"></label>
                </div>

                <!-- Hi-Hat -->
                <div class="row hihat">
                    <div class="track-label">
                        <span class="track-dot"></span>
                        <span class="track-name">Hi-Hat</span>
                    </div>
                    <label class="cell beat-start"><input type="checkbox" checked aria-label="Hi-Hat step 1"></label>
                    <label class="cell"><input type="checkbox" aria-label="Hi-Hat step 2"></label>
                    <label class="cell"><input type="checkbox" checked aria-label="Hi-Hat step 3"></label>
                    <label class="cell"><input type="checkbox" aria-label="Hi-Hat step 4"></label>
                    <label class="cell beat-start"><input type="checkbox" checked aria-label="Hi-Hat step 5"></label>
                    <label class="cell"><input type="checkbox" aria-label="Hi-Hat step 6"></label>
                    <label class="cell"><input type="checkbox" checked aria-label="Hi-Hat step 7"></label>
                    <label class="cell"><input type="checkbox" aria-label="Hi-Hat step 8"></label>
                    <label class="cell beat-start"><input type="checkbox" checked aria-label="Hi-Hat step 9"></label>
                    <label class="cell"><input type="checkbox" aria-label="Hi-Hat step 10"></label>
                    <label class="cell"><input type="checkbox" checked aria-label="Hi-Hat step 11"></label>
                    <label class="cell"><input type="checkbox" aria-label="Hi-Hat step 12"></label>
                    <label class="cell beat-start"><input type="checkbox" checked aria-label="Hi-Hat step 13"></label>
                    <label class="cell"><input type="checkbox" aria-label="Hi-Hat step 14"></label>
                    <label class="cell"><input type="checkbox" checked aria-label="Hi-Hat step 15"></label>
                    <label class="cell"><input type="checkbox" aria-label="Hi-Hat step 16"></label>
                </div>

                <!-- Clap -->
                <div class="row clap">
                    <div class="track-label">
                        <span class="track-dot"></span>
                        <span class="track-name">Clap</span>
                    </div>
                    <label class="cell beat-start"><input type="checkbox" aria-label="Clap step 1"></label>
                    <label class="cell"><input type="checkbox" aria-label="Clap step 2"></label>
                    <label class="cell"><input type="checkbox" aria-label="Clap step 3"></label>
                    <label class="cell"><input type="checkbox" aria-label="Clap step 4"></label>
                    <label class="cell beat-start"><input type="checkbox" aria-label="Clap step 5"></label>
                    <label class="cell"><input type="checkbox" aria-label="Clap step 6"></label>
                    <label class="cell"><input type="checkbox" aria-label="Clap step 7"></label>
                    <label class="cell"><input type="checkbox" checked aria-label="Clap step 8"></label>
                    <label class="cell beat-start"><input type="checkbox" aria-label="Clap step 9"></label>
                    <label class="cell"><input type="checkbox" aria-label="Clap step 10"></label>
                    <label class="cell"><input type="checkbox" aria-label="Clap step 11"></label>
                    <label class="cell"><input type="checkbox" aria-label="Clap step 12"></label>
                    <label class="cell beat-start"><input type="checkbox" aria-label="Clap step 13"></label>
                    <label class="cell"><input type="checkbox" aria-label="Clap step 14"></label>
                    <label class="cell"><input type="checkbox" aria-label="Clap step 15"></label>
                    <label class="cell"><input type="checkbox" checked aria-label="Clap step 16"></label>
                </div>

                <!-- Bass -->
                <div class="row bass">
                    <div class="track-label">
                        <span class="track-dot"></span>
                        <span class="track-name">Bass</span>
                    </div>
                    <label class="cell beat-start"><input type="checkbox" checked aria-label="Bass step 1"></label>
                    <label class="cell"><input type="checkbox" aria-label="Bass step 2"></label>
                    <label class="cell"><input type="checkbox" aria-label="Bass step 3"></label>
                    <label class="cell"><input type="checkbox" checked aria-label="Bass step 4"></label>
                    <label class="cell beat-start"><input type="checkbox" aria-label="Bass step 5"></label>
                    <label class="cell"><input type="checkbox" aria-label="Bass step 6"></label>
                    <label class="cell"><input type="checkbox" checked aria-label="Bass step 7"></label>
                    <label class="cell"><input type="checkbox" aria-label="Bass step 8"></label>
                    <label class="cell beat-start"><input type="checkbox" checked aria-label="Bass step 9"></label>
                    <label class="cell"><input type="checkbox" aria-label="Bass step 10"></label>
                    <label class="cell"><input type="checkbox" aria-label="Bass step 11"></label>
                    <label class="cell"><input type="checkbox" checked aria-label="Bass step 12"></label>
                    <label class="cell beat-start"><input type="checkbox" aria-label="Bass step 13"></label>
                    <label class="cell"><input type="checkbox" aria-label="Bass step 14"></label>
                    <label class="cell"><input type="checkbox" aria-label="Bass step 15"></label>
                    <label class="cell"><input type="checkbox" aria-label="Bass step 16"></label>
                </div>

            </div>
        </section>
    </div>
</body>
</html>
